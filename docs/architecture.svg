<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 566" width="960" height="566" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- card: explicit background so it reads the same on light and dark GitHub -->
  <rect x="1" y="1" width="958" height="564" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Browser -->
  <rect x="40" y="50" width="270" height="200" rx="10" fill="#f6f8fa" stroke="#8c959f"/>
  <text x="60" y="82" font-size="18" font-weight="700" fill="#1f2328">Browser</text>
  <text x="60" y="112" font-size="14" fill="#1f2328">• microphone</text>
  <text x="60" y="137" font-size="14" fill="#1f2328">• live transcript</text>
  <text x="60" y="162" font-size="14" fill="#1f2328">• new terms highlighted,</text>
  <text x="74" y="182" font-size="14" fill="#1f2328">one-line definitions</text>
  <text x="60" y="207" font-size="14" fill="#1f2328">• "I'm lost" button</text>

  <!-- AssemblyAI streaming -->
  <rect x="650" y="50" width="270" height="200" rx="10" fill="#eef4ff" stroke="#3b6fd4"/>
  <text x="670" y="82" font-size="18" font-weight="700" fill="#1f2328">AssemblyAI</text>
  <text x="670" y="104" font-size="13" fill="#3b6fd4">streaming speech-to-text</text>
  <text x="670" y="134" font-size="14" fill="#1f2328">• Universal-3.5 Pro</text>
  <text x="670" y="159" font-size="14" fill="#1f2328">• keyterms from course memory</text>
  <text x="670" y="184" font-size="14" fill="#1f2328">• turn closed after ≤ 10 s</text>
  <text x="684" y="204" font-size="13" fill="#57606a">(ForceEndpoint)</text>

  <!-- audio / text between browser and AssemblyAI -->
  <line x1="312" y1="110" x2="646" y2="110" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="479" y="100" font-size="13" text-anchor="middle" fill="#57606a">audio, straight from the microphone</text>
  <line x1="646" y1="175" x2="312" y2="175" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="479" y="197" font-size="13" text-anchor="middle" fill="#57606a">text of each turn, ~0.5 s</text>

  <!-- browser <-> server -->
  <line x1="120" y1="252" x2="120" y2="318" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="112" y="290" font-size="13" text-anchor="end" fill="#57606a">finished</text>
  <text x="112" y="306" font-size="13" text-anchor="end" fill="#57606a">turn</text>
  <line x1="230" y1="318" x2="230" y2="252" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <text x="240" y="282" font-size="13" fill="#57606a">definitions · token</text>
  <text x="240" y="298" font-size="13" fill="#57606a">· keyterms</text>

  <!-- Server -->
  <rect x="40" y="320" width="570" height="222" rx="10" fill="#fff8ec" stroke="#c8871e"/>
  <text x="60" y="350" font-size="18" font-weight="700" fill="#1f2328">Server</text>
  <text x="142" y="350" font-size="13" fill="#57606a">never waits on the model: judging runs in the background</text>

  <!-- pipeline -->
  <rect x="58" y="366" width="112" height="62" rx="8" fill="#ffffff" stroke="#c8871e"/>
  <text x="114" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">1 · word list</text>
  <text x="114" y="410" font-size="12" text-anchor="middle" fill="#57606a">drops the, and</text>

  <rect x="184" y="366" width="142" height="62" rx="8" fill="#ffffff" stroke="#c8871e"/>
  <text x="255" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">2 · everyday rule</text>
  <text x="255" y="410" font-size="12" text-anchor="middle" fill="#57606a">3,907 common words</text>

  <rect x="340" y="366" width="106" height="62" rx="8" fill="#ffffff" stroke="#c8871e" stroke-dasharray="5 4"/>
  <text x="393" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">queue</text>
  <text x="393" y="410" font-size="12" text-anchor="middle" fill="#57606a">word + sentence</text>

  <rect x="460" y="366" width="136" height="62" rx="8" fill="#ffffff" stroke="#c8871e"/>
  <text x="528" y="390" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2328">3 · term judge</text>
  <text x="528" y="410" font-size="12" text-anchor="middle" fill="#57606a">term here, or not?</text>

  <line x1="171" y1="397" x2="181" y2="397" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="327" y1="397" x2="337" y2="397" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="447" y1="397" x2="457" y2="397" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>

  <!-- course memory -->
  <rect x="58" y="442" width="538" height="84" rx="8" fill="#ffffff" stroke="#c8871e"/>
  <text x="76" y="466" font-size="14" font-weight="700" fill="#1f2328">Course memory</text>
  <text x="76" y="484" font-size="12" fill="#57606a">what this course has already taught: starts from seed/,</text>
  <text x="76" y="499" font-size="12" fill="#57606a">learns every term the judge accepts, forgets every word it rejects,</text>
  <text x="76" y="514" font-size="12" fill="#57606a">and goes back to AssemblyAI as keyterms</text>

  <!-- LLM Gateway -->
  <rect x="650" y="320" width="270" height="222" rx="10" fill="#eef4ff" stroke="#3b6fd4"/>
  <text x="670" y="352" font-size="18" font-weight="700" fill="#1f2328">AssemblyAI</text>
  <text x="670" y="374" font-size="13" fill="#3b6fd4">LLM Gateway</text>
  <text x="670" y="404" font-size="14" fill="#1f2328">• the judge: is this word a</text>
  <text x="684" y="424" font-size="14" fill="#1f2328">term of the subject in this</text>
  <text x="684" y="444" font-size="14" fill="#1f2328">sentence? + one-line definition</text>
  <text x="670" y="474" font-size="14" fill="#1f2328">• "I'm lost": the thread</text>
  <text x="684" y="494" font-size="14" fill="#1f2328">between the new terms</text>

  <line x1="598" y1="386" x2="646" y2="386" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="646" y1="410" x2="598" y2="410" stroke="#57606a" stroke-width="2" marker-end="url(#a)"/>
</svg>
