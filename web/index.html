<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture Lens</title>
<style>
  :root {
    --bg: #16181c; --panel: #1e2126; --line: #2c3037;
    --ink: #e6e9ee; --dim: #8b939e;
    --new: #ffc66d; --known: #6dd3c3;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.7 system-ui, sans-serif;
    display: grid; grid-template-columns: 1fr 280px; height: 100vh;
  }
  @media (max-width: 720px) { body { grid-template-columns: 1fr; } aside { display: none; } }

  /* min-height:0 on both: a grid item and a flex item both refuse to shrink
     below their content by default, which pushes the panel below the fold. */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .spacer { flex: 1; }

  button {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button[disabled] { opacity: .4; cursor: default; }
  button.live { border-color: var(--new); color: var(--new); }

  .metric { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .metric b { color: var(--ink); font-weight: 500; }

  #transcript {
    flex: 1 1 0; min-height: 0; overflow-y: auto;
    padding: 24px 20px; font-size: 17px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .turn { transition: opacity .4s; }
  .turn.partial { color: var(--dim); }
  /* the one visual beat: everything recedes, the unknown word does not */
  #transcript.spotlight .turn:not(.holds-new) { opacity: .25; }

  .gloss {
    display: flex; gap: 10px; align-items: baseline;
    font-size: 14px; padding: 8px 12px; margin-left: 2px;
    border-left: 2px solid var(--new); background: var(--panel);
    border-radius: 0 5px 5px 0; transition: opacity .8s;
  }
  .gloss b { color: var(--new); font-family: var(--mono); font-size: 13px; }
  .gloss span { color: var(--dim); }
  .gloss.fade { opacity: .35; }

  .term { color: var(--known); }
  .term.fresh {
    color: var(--new); font-weight: 600;
    border-bottom: 2px solid var(--new); padding-bottom: 1px;
  }

  aside {
    border-left: 1px solid var(--line); padding: 16px;
    display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
  }
  aside h2 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--dim); margin: 0; font-weight: 500;
  }
  #glossary { display: flex; flex-direction: column; gap: 4px; }
  .entry {
    font-family: var(--mono); font-size: 12px; padding: 4px 8px;
    border-radius: 4px; background: var(--panel);
    display: flex; justify-content: space-between; gap: 8px;
  }
  .entry.just-added { animation: land .6s ease-out; }
  @keyframes land {
    from { background: var(--new); color: #16181c; transform: translateX(10px); }
  }
  .entry span:last-child { color: var(--dim); }

  #status { flex: none; padding: 8px 20px; border-top: 1px solid var(--line);
            font-family: var(--mono); font-size: 12px; color: var(--dim); }
  /* A visible trace of every step. Faults here are invisible otherwise:
     the socket just closes and the page looks idle. flex:none keeps it from
     being squeezed to nothing when the transcript grows. */
  #log {
    flex: none; border-top: 1px solid var(--line); background: #101216;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.55;
    height: 180px; overflow-y: auto; padding: 8px 20px;
  }
  #log div { display: flex; gap: 10px; white-space: pre-wrap; }
  #log .t { color: #5a626d; flex: none; }
  #log .ok   { color: var(--known); }
  #log .warn { color: var(--new); }
  #log .err  { color: #ff7b72; }

  /* --- "I'm lost" ---------------------------------------------------------
     A panel, not a dialog. A dialog would take the lecture away from the
     student for as long as it is open, and the lecturer does not stop. */
  button.lost { border-color: #4a3f52; color: #cdb4db; }
  button.lost:hover { border-color: #cdb4db; }
  button.lost.busy { opacity: .6; cursor: progress; }

  #why {
    flex: none; display: none; gap: 12px; flex-direction: column;
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 14px 20px; max-height: 40vh; overflow-y: auto;
    animation: rise .25s ease-out;
  }
  #why.open { display: flex; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }

  #why header { padding: 0; border: 0; gap: 10px; }
  #why h2 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: #cdb4db; margin: 0; font-weight: 500;
  }
  #why-rate { font-family: var(--mono); font-size: 11.5px; color: var(--dim); }
  #why-text { font-size: 15px; line-height: 1.65; margin: 0; }
  #why-terms { display: flex; flex-wrap: wrap; gap: 6px; }
  #why-terms .chip {
    font-family: var(--mono); font-size: 12px; padding: 3px 9px;
    border-radius: 999px; background: #16181c; border: 1px solid var(--line);
    color: var(--new);
  }
  #why .close {
    border: 0; background: none; color: var(--dim); padding: 0 4px; font-size: 18px;
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
  <main>
    <header>
      <h1>Lecture Lens</h1>
      <span class="metric">course <b id="course">c-programming</b></span>
      <span class="spacer"></span>
      <span class="metric">latency <b id="lat">—</b></span>
      <span class="metric">known <b id="count">0</b></span>
      <button id="lost" class="lost" title="Explain why this got hard to follow">I'm lost</button>
      <button id="go">Start listening</button>
    </header>
    <div id="transcript"></div>
    <section id="why">
      <header>
        <h2>Why this got hard</h2>
        <span id="why-rate" class="metric"></span>
        <span class="spacer"></span>
        <button class="close" id="why-close" title="Close">&times;</button>
      </header>
      <div id="why-terms"></div>
      <p id="why-text"></p>
    </section>
    <div id="status">idle</div>
    <div id="log"></div>
  </main>
  <aside>
    <h2>Course glossary</h2>
    <div id="glossary"></div>
  </aside>

<script>
const COURSE = "c-programming";
const SUBJECT = "C programming";   // tells the judge what counts as a term here
const TARGET_RATE = 16000;          // what the streaming API expects
const FRAME_MS = 50;

const $ = id => document.getElementById(id);
const transcript = $("transcript");
const say = m => $("status").textContent = m;

const t0 = performance.now();
const LOG_LINES = 300;          // what fits a problem, not a lecture
const TRANSCRIPT_TURNS = 150;   // roughly the last fifteen minutes on screen

// Only follow the speaker if the reader is already at the bottom. Scrolling
// back to re-read the sentence that contained the unknown word is the whole
// point of having a transcript, and an unconditional jump makes it impossible.
function keepUp(el, near = 120) {
  const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < near;
  if (atBottom) el.scrollTop = el.scrollHeight;
}

function log(msg, kind = "") {
  const row = document.createElement("div");
  const at = document.createElement("span");
  at.className = "t";
  at.textContent = `+${((performance.now() - t0) / 1000).toFixed(2)}s`;
  const body = document.createElement("span");
  body.className = kind;
  body.textContent = msg;
  row.append(at, body);
  $("log").append(row);
  // Fifty minutes of diagnostics is tens of thousands of nodes, and each new
  // line reads scrollHeight, which forces a layout of the whole column.
  const panel = $("log");
  while (panel.childElementCount > LOG_LINES) panel.firstElementChild.remove();
  panel.scrollTop = panel.scrollHeight;
  console.log(`[lens] ${msg}`);
}

let ws, audioCtx, node, stream, running = false;
let streamStart = null, audioMs = 0, latencies = [], framesSent = 0;
const known = new Set();

/* ---------- audio ----------------------------------------------------------
   The browser hands us Float32 samples in [-1, 1] at whatever rate the device
   runs (usually 48000). The API wants signed 16-bit integers at 16000. Two
   conversions, both done here.
--------------------------------------------------------------------------- */

// Linear interpolation between neighbouring samples. Taking every third sample
// would only work at exactly 48k; this handles 44.1k and anything else.
//
// The state matters. A block of 128 samples at 48 kHz is 42.67 output samples,
// and a resampler that rounds that down to 42 on every call throws away 1.5% of
// the audio. The loss is invisible per block and ruinous in aggregate: the audio
// timeline falls behind the wall clock by about a second every minute, which is
// both a pitch shift and a latency measurement that climbs forever. So carry
// the fractional position, and the last sample, across calls.
const rs = { pos: 0, tail: 0 };

function resample(input, fromRate, toRate) {
  if (fromRate === toRate) return input;
  const ratio = fromRate / toRate;
  const out = [];

  // pos is measured from the start of `input`, and may begin negative — that
  // means the next output sample falls between the previous block and this one.
  let pos = rs.pos;
  while (pos < input.length) {
    const low = Math.floor(pos);
    const frac = pos - low;
    const a = low < 0 ? rs.tail : input[low];
    const b = low + 1 < input.length ? input[low + 1] : input[input.length - 1];
    out.push(a + (b - a) * frac);
    pos += ratio;
  }

  rs.pos = pos - input.length;          // carry the remainder into the next block
  rs.tail = input[input.length - 1];
  return Float32Array.from(out);
}

// -1.0..1.0 -> -32768..32767. Clamp first: a sample slightly over 1.0 would
// wrap around to a large negative number and click loudly.
function toPCM16(floats) {
  const out = new Int16Array(floats.length);
  for (let i = 0; i < floats.length; i++) {
    const s = Math.max(-1, Math.min(1, floats[i]));
    out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
  }
  return out;
}

// Runs on the audio thread, so a slow main thread cannot drop frames.
const WORKLET = `
class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) this.port.postMessage(new Float32Array(ch));
    return true;
  }
}
registerProcessor('tap', Tap);
`;

/* ---------- session --------------------------------------------------------
   A lecture is fifty minutes and a websocket is not. Wi-Fi drops, a laptop
   sleeps for a moment, the server hiccups. The first version answered all of
   those by stopping, which costs the student the rest of the lecture — the one
   thing this is supposed to prevent. So the socket is disposable and the audio
   graph is not: a drop replaces the socket and leaves the microphone alone.
--------------------------------------------------------------------------- */

// Doubling, then a ceiling. Five attempts over half a minute is long enough to
// ride out a lift or a router reboot, and short enough that a genuinely dead
// connection is reported rather than retried at forever.
const RETRY_MS = [1000, 2000, 4000, 8000, 15000];

// How long a socket must hold before we call it recovered. Without this, a
// link that opens and dies two seconds later resets the attempt counter every
// time, and "five attempts" becomes an infinite loop at one-second intervals
// — each one minting a token. Opening is not recovering; staying open is.
const STABLE_MS = 10000;

let retry = 0;
let openedAt = 0;
let retryTimer = null;
let stopping = false;          // a close the user asked for is not a failure
let framesTotal = 0;
let pending16 = new Int16Array(0);

const FRAME_SAMPLES = (TARGET_RATE * FRAME_MS) / 1000;   // 800

async function start() {
  $("log").replaceChildren();
  log(`page on ${location.protocol}//${location.host}`);
  log(`secure context: ${window.isSecureContext} (microphone needs true)`);

  say("requesting microphone…");
  log("asking for the microphone…");
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: false, noiseSuppression: false }
  });
  log(`microphone granted: ${stream.getAudioTracks()[0]?.label || "unnamed"}`, "ok");

  // The graph is built once and outlives every socket. Tearing it down on a
  // drop would mean asking for the microphone again, and the browser may well
  // put up another permission prompt in the middle of the lecture.
  audioCtx = new AudioContext();
  const blob = URL.createObjectURL(new Blob([WORKLET], { type: "application/javascript" }));
  await audioCtx.audioWorklet.addModule(blob);
  node = new AudioWorkletNode(audioCtx, "tap");

  // The worklet fires every 128 samples — about 2.7 ms, and after resampling
  // roughly 84 bytes. Sending that straight out means ~375 tiny messages a
  // second, which the server does not expect. Accumulate to one 50 ms frame
  // (800 samples at 16 kHz) and send that, exactly like the Python client.
  node.port.onmessage = ev => {
    if (ws?.readyState !== WebSocket.OPEN) return;   // between sockets: drop it

    const chunk = toPCM16(resample(ev.data, audioCtx.sampleRate, TARGET_RATE));
    const merged = new Int16Array(pending16.length + chunk.length);
    merged.set(pending16);
    merged.set(chunk, pending16.length);
    pending16 = merged;

    while (pending16.length >= FRAME_SAMPLES) {
      const frame = pending16.slice(0, FRAME_SAMPLES);
      pending16 = pending16.slice(FRAME_SAMPLES);
      audioMs += FRAME_MS;
      framesSent++;
      framesTotal++;
      ws.send(frame.buffer);
      if (framesTotal === 1) log(`first frame sent, ${frame.byteLength} bytes`, "ok");
    }
  };

  // The graph only runs if it reaches the destination — a node that leads
  // nowhere may never be pulled, and then no audio is ever captured. Route it
  // through a silent gain so we get the frames without hearing ourselves.
  const mute = audioCtx.createGain();
  mute.gain.value = 0;
  audioCtx.createMediaStreamSource(stream).connect(node);
  node.connect(mute).connect(audioCtx.destination);

  // Chrome starts contexts suspended until a user gesture has resumed them.
  if (audioCtx.state === "suspended") await audioCtx.resume();
  log(`audio context ${audioCtx.state} at ${audioCtx.sampleRate} Hz`,
      audioCtx.state === "running" ? "ok" : "err");

  running = true;
  stopping = false;
  retry = 0;
  // Leftovers from the previous session: half a frame of the morning lecture,
  // and a resampler still interpolating against its last sample.
  pending16 = new Int16Array(0);
  rs.pos = 0; rs.tail = 0;
  framesTotal = 0;
  $("go").textContent = "Stop";
  $("go").classList.add("live");

  clearInterval(pollTimer);
  pollTimer = setInterval(poll, 1500);

  try {
    await openSocket();
  } catch (e) {
    // Everything above already said "live": the button is orange, the
    // microphone is hot, the poller is running. Without this the student
    // watches a listening-looking page produce nothing for fifty minutes.
    log(`could not open the session: ${e.message}`, "err");
    say("could not connect — press Start to try again");
    stop();
    return;
  }

  // Watch for a silent worklet — but only once the socket is actually open,
  // or this fires during the handshake and cries wolf.
  setTimeout(() => {
    if (!running || ws?.readyState !== WebSocket.OPEN) return;
    if (framesTotal === 0) log("socket open but no frames — check the worklet", "err");
  }, 2500);
}

async function openSocket() {
  // Keyterms are fetched again, not remembered. The course has been learning
  // for the whole lecture, so a socket opened at minute forty starts with a
  // better vocabulary than the one opened at minute zero.
  // Two awaits follow, and the student may press Stop during either. Without
  // these checks openSocket carries on and installs a socket into a session
  // that no longer exists.
  if (!running) return;
  say(retry ? "reconnecting…" : "fetching glossary…");
  const preRes = await fetch("/api/keyterms", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ course: COURSE })
  });
  if (!preRes.ok) throw new Error(`/api/keyterms ${preRes.status}`);
  const pre = await preRes.json();
  log(`glossary: ${pre.known_count} terms known, ${pre.keyterms.length} sent as keyterms`, "ok");
  pre.keyterms.forEach(t => addEntry(t, "", false));
  $("count").textContent = pre.known_count;

  if (!running) return;

  // A fresh token every time: they are single-use and expire in two minutes,
  // so the one that opened the first socket is no good for the second.
  const tokRes = await fetch("/api/token?expires_in_seconds=120");
  if (!tokRes.ok) throw new Error(`/api/token ${tokRes.status}`);
  const { token } = await tokRes.json();
  log(`token received, ${token ? token.length : 0} chars`, token ? "ok" : "err");

  const params = new URLSearchParams({
    token,
    speech_model: "universal-3-5-pro",
    sample_rate: TARGET_RATE,
    encoding: "pcm_s16le",
    format_turns: "true"                  // keyterms only apply to formatted turns
  });
  if (pre.keyterms.length) params.set("keyterms_prompt", JSON.stringify(pre.keyterms));

  if (!running) return;

  const url = `wss://streaming.assemblyai.com/v3/ws?${params}`;
  log(`opening socket, params: ${params.toString().replace(/token=[^&]+/, "token=…")}`);

  framesSent = 0;
  openedAt = 0;
  const sock = new WebSocket(url);
  ws = sock;
  ws.binaryType = "arraybuffer";

  // Every handler checks it is still the current socket first. An orphan —
  // one replaced while its handshake was still running — used to fire onclose
  // with `running` true, which scheduled a reconnect that then replaced the
  // healthy socket. A dead connection tearing down a live one.
  ws.onopen = () => {
    if (sock !== ws) { try { sock.close(); } catch {} return; }
    say("listening");
    // Each socket is its own audio timeline: word.end counts from ITS start,
    // so latency measured against the old origin would climb by however long
    // the gap was and never come back.
    streamStart = performance.now();
    lastWordEnd = null;
    openedAt = performance.now();
    if (retry) log(`reconnected after ${retry} attempt(s)`, "ok");
    log("socket open", "ok");
  };

  ws.onerror = e => {
    if (sock !== ws) return;
    console.error("[ws] error", e); log("socket error", "err");
  };

  ws.onclose = e => {
    if (sock !== ws) return;
    // The close frame carries why. Throwing it away turns every failure into
    // the same useless "closed".
    log(`socket closed — code ${e.code}, reason "${e.reason || "(none)"}", ` +
        `clean ${e.wasClean}, ${framesSent} frames on this socket`,
        e.code === 1000 ? "warn" : "err");
    if (framesTotal === 0) log("no audio ever reached the socket — the graph is not running", "err");

    if (stopping || !running) { say(`closed (${e.code}) · ${framesTotal} frames sent`); stop(); return; }

    // Earned a clean slate only by holding the line, not by answering the phone.
    if (openedAt && performance.now() - openedAt >= STABLE_MS) {
      log(`that connection held for ${Math.round((performance.now() - openedAt) / 1000)}s`);
      retry = 0;
    }
    reconnect();
  };

  ws.onmessage = e => {
    if (sock !== ws) return;
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === "Begin") log(`session ${m.id} accepted`, "ok");
    if (m.type === "Termination") log(`terminated: ${m.audio_duration_seconds}s of audio`, "warn");
    if (m.error) log(`server says: ${m.error}`, "err");
    handle(m);
  };
}

function reconnect() {
  if (retry >= RETRY_MS.length) {
    log(`gave up after ${retry} attempts — the connection is not coming back`, "err");
    say("disconnected");
    stop();
    return;
  }

  const wait = RETRY_MS[retry++];
  // Whatever was half-collected belongs to a session that no longer exists.
  // Sending it into the next one would splice two timelines together.
  pending16 = new Int16Array(0);

  say(`reconnecting in ${Math.round(wait / 1000)}s…`);
  log(`waiting ${wait} ms before attempt ${retry}`, "warn");

  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    retryTimer = null;
    if (!running) return;
    openSocket().catch(err => {
      log(`reconnect attempt ${retry} failed: ${err.message}`, "err");
      reconnect();
    });
  }, wait);
}

function stop() {
  if (!running) return;              // onclose calls stop, stop must not recurse
  running = false;
  stopping = true;
  // The status line was counting down to a reconnect that is not going to
  // happen now. Leaving it there tells the student the page is still trying.
  const wasReconnecting = retryTimer !== null;
  clearTimeout(retryTimer);
  retryTimer = null;
  if (wasReconnecting) say("stopped");
  $("go").textContent = "Start listening";
  $("go").classList.remove("live");

  // Say goodbye before tearing the audio down, or the socket is already gone.
  // Then close it. Sending Terminate is a request; only close() is a promise,
  // and a socket still mid-handshake never heard the request at all — it used
  // to finish connecting after Stop and announce "listening" to a dead page.
  try {
    if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "Terminate" }));
    ws?.close();
  } catch {}
  // NOT ws = null. A real socket fires onclose on a later tick, and the
  // identity guard there would then see ws === null, decide the event belongs
  // to somebody else, and skip the closing diagnostic — the one line that says
  // how many frames the session actually sent. The guard is there to ignore a
  // socket that was REPLACED, not one that was closed. Nothing sends into it
  // either way: the frame path already checks readyState.
  try { node?.disconnect(); } catch {}
  try { audioCtx?.close(); } catch {}
  stream?.getTracks().forEach(t => t.stop());

  // The last sentences are still being judged. Keep collecting for a few more
  // seconds instead of dropping their definitions on the floor — but only this
  // poller, in case listening starts again in the meantime.
  const mine = pollTimer;
  setTimeout(() => {
    if (pollTimer === mine) { clearInterval(pollTimer); pollTimer = null; }
  }, 10000);
}

/* ---------- transcript ----------------------------------------------------- */

let partialEl = null;
let lastWordEnd = null;

function handle(msg) {
  if (msg.type !== "Turn") return;

  // Word timings ride on unformatted turns; the formatted final has none.
  const words = msg.words || [];
  if (words.length && words.at(-1).end != null) lastWordEnd = words.at(-1).end;

  if (!msg.transcript) return;

  if (msg.end_of_turn) {
    if (lastWordEnd != null && streamStart != null) {
      // Same formula as the Python client: wall clock elapsed minus the
      // position of that word on the audio timeline.
      const ms = (performance.now() - streamStart) - lastWordEnd;
      if (ms > 0 && ms < 5000) {
        latencies.push(ms);
        if (latencies.length > 600) latencies.shift();
        latencies.sort((a, b) => a - b);
        $("lat").textContent = Math.round(latencies[latencies.length >> 1]) + " ms";
      }
    }
    lastWordEnd = null;
    partialEl?.remove();
    partialEl = null;
    finalise(msg.transcript);
  } else {
    if (!partialEl) {
      partialEl = document.createElement("div");
      partialEl.className = "turn partial";
      transcript.append(partialEl);
    }
    partialEl.textContent = msg.transcript;
    keepUp(transcript);
  }
}

// What was said recently, with when. The server keeps no transcript — a
// lecture is somebody else's speech — so the words for "I'm lost" have to
// come from here, and only the ones still inside the window.
const WINDOW_S = 180;
const spoken = [];

// Turns fall off the top once they are far behind the speaker. Their glosses
// go with them: a gloss without its sentence explains nothing.
function trimTranscript() {
  while (transcript.childElementCount > TRANSCRIPT_TURNS) {
    transcript.firstElementChild.remove();
  }
}

async function finalise(text) {
  spoken.push({ text, at: performance.now() });
  // Only the last window is ever sent; the rest is fifty minutes of strings.
  const cutoff = performance.now() - WINDOW_S * 1000;
  while (spoken.length && spoken[0].at < cutoff) spoken.shift();

  const el = document.createElement("div");
  el.className = "turn";
  el.textContent = text;
  transcript.append(el);
  trimTranscript();
  keepUp(transcript);

  // Failures here were invisible: the transcript kept flowing and the glossary
  // silently stayed empty.
  let res;
  try {
    const r = await fetch("/api/observe", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ course: COURSE, subject: SUBJECT, text })
    });
    if (!r.ok) { log(`/api/observe ${r.status}: ${(await r.text()).slice(0, 200)}`, "err"); return; }
    res = await r.json();
  } catch (e) {
    log(`/api/observe failed: ${e.message}`, "err");
    return;
  }

  $("count").textContent = res.known_count;

  // Words nobody has judged yet. Remember which sentence each one came from,
  // so the definition can be attached to it when the verdict arrives a second
  // or two later instead of appearing out of context in the sidebar alone.
  for (const w of res.pending || []) awaiting.set(w.toLowerCase(), { el, at: performance.now() });

  const fresh = Object.keys(res.new_terms || {});
  const p = (res.pending || []).length;
  log(`turn: ${fresh.length} known term${fresh.length === 1 ? "" : "s"}, ` +
      `${p} to judge, ${res.known_count} in course` +
      (fresh.length ? ` — ${fresh.join(", ")}` : ""), fresh.length ? "ok" : "");

  if (!fresh.length) return;

  // Already judged in an earlier lecture: straight to the screen, no waiting.
  markUp(el, fresh);
  for (const [term, definition] of Object.entries(res.new_terms)) {
    addEntry(term, definition, true);
    if (definition) showGloss(el, term, definition);
  }
  spotlight(el);
}

/* ---------- late verdicts --------------------------------------------------- */

// term (lowercase) -> { el, at }: the sentence a pending word was spoken in.
//
// Entries are removed when the verdict arrives — but a word the judge rejects,
// or gives up on, never gets one. Left alone the map grows all lecture and
// holds a strong reference to every turn it ever touched, so none of the
// transcript can be reclaimed. Anything older than the grace period is no
// longer going to be answered.
const awaiting = new Map();
const AWAIT_GRACE_MS = 90000;
let pollTimer = null;

function pruneAwaiting() {
  const cutoff = performance.now() - AWAIT_GRACE_MS;
  for (const [term, entry] of awaiting) {
    if (entry.at < cutoff) awaiting.delete(term);
  }
}

let polling = false;

async function poll() {
  // A slow server used to have seven of these in flight at once, resolving out
  // of order — and each one writes the known-terms counter, so it jumped
  // backwards. One at a time; a missed tick costs 1.5 seconds.
  if (polling) return;
  polling = true;

  let res;
  try {
    const r = await fetch(`/api/updates?course=${encodeURIComponent(COURSE)}`);
    if (!r.ok) return;
    res = await r.json();
  } catch {
    return;
  } finally {
    polling = false;
  }

  // A 200 is not a promise about shape. Reading known_count blindly wrote the
  // string "undefined" into the header, and res.terms.length then threw inside
  // the interval, where nothing reports it.
  if (typeof res?.known_count === "number") $("count").textContent = res.known_count;
  pruneAwaiting();
  if (!Array.isArray(res?.terms) || !res.terms.length) return;

  const named = [];
  let flash = null;

  for (const { term, definition, note } of res.terms) {
    if (note) log(`could not define ${term}: ${note}`, "warn");
    named.push(term);
    addEntry(term, definition, true);

    const key = term.toLowerCase();
    const el = awaiting.get(key)?.el;
    awaiting.delete(key);
    // isConnected: the sentence may have been cleared while we were waiting.
    if (!el || !el.isConnected) continue;

    markUp(el, [term]);
    if (definition) showGloss(el, term, definition);
    flash = el;
  }

  log(`judged: ${named.join(", ")}` +
      (res.waiting ? ` (${res.waiting} still queued)` : ""), "ok");
  if (flash) spotlight(flash);
}

// Rebuild the turn word by word so the new terms can be coloured.
// Punctuation is kept outside the span: highlighting "malloc." with the full
// stop inside looks like the stop is part of the term.
function markUp(el, fresh) {
  // Terms arrive for the same sentence at different times, and each call
  // rebuilds the element from its text. Without remembering what was already
  // highlighted, marking the second term would erase the first.
  el._terms ??= new Set();
  for (const t of fresh) el._terms.add(t.toLowerCase().replace(/[.,;:!?()"']/g, ""));

  const set = el._terms;
  const frag = document.createDocumentFragment();

  for (const token of el.textContent.split(/(\s+)/)) {
    if (/^\s+$/.test(token) || token === "") { frag.append(token); continue; }

    const bare = token.replace(/[.,;:!?()"']/g, "");
    if (!set.has(bare.toLowerCase())) { frag.append(token); continue; }

    const at = token.indexOf(bare);
    frag.append(token.slice(0, at));              // leading quote, bracket…
    const span = document.createElement("span");
    span.className = "term fresh";
    span.textContent = bare;
    frag.append(span);
    frag.append(token.slice(at + bare.length));   // trailing full stop, comma…
  }

  el.replaceChildren(frag);
}

function spotlight(el) {
  el.classList.add("holds-new");
  transcript.classList.add("spotlight");
  setTimeout(() => transcript.classList.remove("spotlight"), 2200);
}

// The line that appears beside the term while the lecturer is still talking.
// Deliberately one line: reading a paragraph here costs the next thirty
// seconds of the lecture, which is what this is supposed to save.
function showGloss(turnEl, term, definition) {
  const gloss = document.createElement("div");
  gloss.className = "gloss";
  gloss.innerHTML = `<b></b><span></span>`;
  gloss.querySelector("b").textContent = term;
  gloss.querySelector("span").textContent = definition;
  turnEl.after(gloss);
  setTimeout(() => gloss.classList.add("fade"), 6000);
}

function addEntry(term, definition, fresh) {
  const key = term.toLowerCase();
  if (known.has(key)) return;
  known.add(key);
  const row = document.createElement("div");
  row.className = "entry" + (fresh ? " just-added" : "");
  row.title = definition || "";
  row.innerHTML = `<span></span><span>${fresh ? "new" : ""}</span>`;
  row.firstChild.textContent = term;
  $("glossary").prepend(row);
}

/* ---------- "I'm lost" ------------------------------------------------------
   The button does not ask for a summary. The student heard the passage; what
   they lost is the thread between the terms that just landed on them, and the
   only place that is known is the course memory on the server. */

const lostBtn = $("lost");

async function askWhy() {
  if (lostBtn.classList.contains("busy")) return;
  lostBtn.classList.add("busy");
  lostBtn.textContent = "thinking…";

  const cutoff = performance.now() - WINDOW_S * 1000;
  const turns = spoken.filter(t => t.at >= cutoff).map(t => t.text);

  let res;
  try {
    const r = await fetch("/api/lost", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ course: COURSE, subject: SUBJECT, turns, window_s: WINDOW_S })
    });
    if (!r.ok) { log(`/api/lost ${r.status}: ${(await r.text()).slice(0, 200)}`, "err"); return; }
    res = await r.json();
  } catch (e) {
    log(`/api/lost failed: ${e.message}`, "err");
    return;
  } finally {
    lostBtn.classList.remove("busy");
    lostBtn.textContent = "I'm lost";
  }

  showWhy(res);
}

function showWhy(res) {
  const terms = Array.isArray(res.terms) ? res.terms : [];
  const d = res.density || {};
  const num = v => (typeof v === "number" ? v : "—");

  $("why-terms").replaceChildren(...terms.map(t => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.textContent = t.term;
    chip.title = t.definition || "";
    return chip;
  }));

  // The rate on its own means nothing; against the lecture's own average it
  // says whether this really was a burst or just felt like one.
  const mins = Math.round(WINDOW_S / 60);
  let rate = `${num(d.in_window)} new in ${mins} min · ${num(d.per_minute)}/min`;
  if (d.session_per_minute != null) {
    rate += ` · lecture average ${d.session_per_minute}/min`;
  }
  $("why-rate").textContent = rate;

  $("why-text").textContent =
    res.why ||
    res.note ||
    "No explanation came back, but the terms above are what landed on you.";

  $("why").classList.add("open");
  log(`lost: ${terms.length} new term(s) in the last ${mins} min` +
      (res.note ? ` — ${res.note}` : ""), terms.length ? "warn" : "");
}

lostBtn.onclick = askWhy;
$("why-close").onclick = () => $("why").classList.remove("open");

$("go").onclick = () => running
  ? stop()
  : start().catch(e => { log(`start failed: ${e.name}: ${e.message}`, "err"); say("error — see log"); });
</script>
</body>
