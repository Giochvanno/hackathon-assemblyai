services:
  - type: web
    name: lecture-lens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir src
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
