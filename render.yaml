services:
  - type: web
    name: lecture-lens
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --app-dir src
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
      # One course shared by every visitor: start again from the seed after
      # ten minutes without speech, so the next person meets the terms as new.
      - key: DEMO_RESET_IDLE_MIN
        value: "10"
